<!DOCTYPE html>
<html lang="de" class="startet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Darstellung vor dem ersten Bild (wie applyTheme in src/lib/theme.ts), damit der rote Start nicht die Farbe wechselt -->
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'||t==='retro')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <!-- Rot, solange der Start steht (src/components/Zwischenschirm.tsx entfernt es); das erste theme-color gilt -->
  <meta name="theme-color" content="#3d0408" data-zwischen>
  <meta name="theme-color" content="#faf9f7">
  <title>Responda: Digitale Einsatzverwaltung für Hilfsorganisationen</title>
  <meta name="description" content="Responda verbindet Patientendokumentation, Medizinprodukte und Lager für Hilfsorganisationen und Feuerwehren, vom Sanitätsdienst bis zur Wasser- und Bergrettung. Derzeit in Entwicklung.">
  <meta name="keywords" content="Responda, Einsatzverwaltung, Hilfsorganisation, Sanitätsdienst, Feuerwehr, digitale Protokolle, Lagerverwaltung, Ausbildungsmanagement, MPG Prüfung">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://responda.systems/">

  <!-- Open Graph (Google-Vorschau, WhatsApp, Social Media) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://responda.systems/">
  <meta property="og:title" content="Responda: Digitale Einsatzverwaltung für Hilfsorganisationen">
  <meta property="og:description" content="Einsatz, Dokumentation, Material und Ausbildung in einer App. Derzeit in Entwicklung.">
  <meta property="og:image" content="https://responda.systems/og-image.png">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="Responda">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Responda: Digitale Einsatzverwaltung für Hilfsorganisationen">
  <meta name="twitter:description" content="Einsatz, Dokumentation, Material und Ausbildung in einer App. Derzeit in Entwicklung.">
  <meta name="twitter:image" content="https://responda.systems/og-image.png">

  <link rel="icon" type="image/svg+xml" href="/logoklein.svg">
  <link rel="apple-touch-icon" href="/logoklein.svg">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <!-- Roter Zwischenbildschirm schon vor dem Programm (src/components/Zwischenschirm.tsx); React ersetzt ihn -->
  <div id="root"><div class="zs" aria-hidden="true"><span class="zs-zeichen"><img src="/logo.svg" alt=""></span></div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
