# Prüfnetz für Responda.
#
# Zweck: Responda wird im Einsatz benutzt — Patientenprotokolle, Atemschutz-
# überwachung, Einsatztagebuch. Netlify veröffentlicht jeden Push auf main direkt.
# Ohne diese Prüfung ginge eine Regression ungebremst auf die Geräte der
# Einsatzkräfte. Sie ist die Voraussetzung dafür, Änderungen überhaupt
# automatisiert zulassen zu können.

name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build:only

      - name: Server-Hooks auf Syntaxfehler prüfen
        # Die pb_hooks laufen in PocketBase, nicht im Build — ein Syntaxfehler
        # fällt dort sonst erst zur Laufzeit auf, wenn der Endpunkt 404 liefert.
        run: |
          fehler=0
          for f in pb_hooks/*.js; do
            node --check "$f" || { echo "Syntaxfehler in $f"; fehler=1; }
          done
          exit $fehler

      - name: Server-Hooks in PocketBase starten (0.28.4 und 0.40.5)
        # Ein Syntaxfehler in pb_hooks hält PocketBase beim Start an; node --check findet nicht
        # alles, was die JSVM ablehnt. Die Probe startet beide Versionen mit pb_hooks auf einem
        # leeren Verzeichnis und prüft, dass die Formular-Routen und der Frist-Lauf geladen sind.
        run: |
          for v in 0.28.4 0.40.5; do
            curl -fsSL -o "$RUNNER_TEMP/pb-$v.zip" "https://github.com/pocketbase/pocketbase/releases/download/v$v/pocketbase_${v}_linux_amd64.zip"
            unzip -q -o "$RUNNER_TEMP/pb-$v.zip" -d "$RUNNER_TEMP/pb-$v"
            node scripts/hooks-rauchprobe.mjs --bin "$RUNNER_TEMP/pb-$v/pocketbase" || exit 1
          done
